# Default on an 8 GB machine: hosted inference of open weights, nothing runs locally.
# Model ids are pinned exactly — a 404 should fail loudly, not silently substitute.
name: hosted

llm:
  base_url: https://router.huggingface.co/v1
  model_id: Qwen/Qwen3-235B-A22B-Instruct-2507
  token_env: hf_token
  temperature: 0.3
  max_tokens: 1024

image:
  # Apache 2.0, text-to-image — used for the very first page, before any reference exists.
  backend: huggingface
  model_id: Qwen/Qwen-Image
  token_env: hf_token
  steps: 30
  guidance: 4.0
  width: 1024
  height: 1024
  # Image-to-image, up to 3 reference images: a character's own earlier render, the previous
  # page, a setting's. Used automatically once any reference exists; Phase 5.
  edit_model_id: Qwen/Qwen-Image-Edit-2511

# Base seed for the run; per-character offsets are added to it.
seed: 20260809
