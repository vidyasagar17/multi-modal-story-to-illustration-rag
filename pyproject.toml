[project]
name = "storyillus"
version = "0.1.0"
description = "Turn public-domain stories into illustrated storybooks with open-weight models"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openai>=2.53.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
storyillus = "storyillus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storyillus"]

[tool.ruff]
line-length = 100
# Prose files carry illustrative snippets, not code to be formatted.
extend-exclude = ["*.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
